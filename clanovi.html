    <div class="container">
        <br>
        <button type="button" class="btnAdd btn-dark" data-toggle="modal" data-target="#modalDod">Dodaj novog člana</button>
        <br>
        <input type="text" id="searchInput" placeholder="Pretraži članove">
        <table class="table" id="table">
            <thead class="thead-dark">
              <tr id="tr">
                <th scope="col">Rbr</th>
                <th scope="col">Ime</th>
                <th scope="col">Prezime</th>
                <th scope="col">Datum rođenja</th>
                <th scope="col">Uredi</th>
                <th scope="col">Obriši</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr>
                <td></td>
              </tr>
            </tbody>
        </table>

        <div class="modal" tabindex="-1" id="modalDod">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">Dodavanje člana</h5>
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                  </button>
                </div>
                <div class="modal-body">
                  <form>
                    <div class="form-group">
                      <label for="ime">Ime</label>
                      <input type="text" class="form-control" id="inptime">
                    </div>
                    <div class="form-group">
                      <label for="prezime">Prezime</label>
                      <input type="text" class="form-control" id="inptprezime">
                    </div>
                    <div class="form-group">
                      <label for="datepicker1">Datum rođenja</label>
                      <input id="datepicker1" type="text" class="form-control">
                    </div>
                    <div class="form-group">
                      <label for="oib">OIB</label>
                      <input type="text" class="form-control" id="inptoib">
                    </div>  
                    <div class="form-group">
                        <label for="adresa">Adresa</label>
                        <input type="text" class="form-control" id="inptadresa">
                    </div>  
                    <div class="form-group">
                        <label for="mjesto">Mjesto</label>
                        <input type="text" class="form-control" id="inptmjesto">
                    </div>  
                    <div class="form-group">
                        <label for="gmail">Email</label>
                        <input type="email" class="form-control" id="inptgmail">
                    </div>  
                  </form>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-dismiss="modal">Zatvori</button>
                  <button type="button" class="btn btn-dark" onclick="Dodaj()" data-dismiss="modal">Dodaj</button>
                </div>
              </div>
            </div>
        </div>

        <div class="modal" tabindex="-1" id="modalUre">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">Uređivanje člana</h5>
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                  </button>
                </div>
                <div class="modal-body">
                    <form>
                      <div class="form-group">
                        <label for="ime">Ime</label>
                        <input type="text" class="form-control" id="edtime">
                      </div>
                      <div class="form-group">
                        <label for="prezime">Prezime</label>
                        <input type="text" class="form-control" id="edtprezime">
                      </div>
                      <div class="form-group">
                        <label for="datepicker2">Datum rođenja</label>
                        <input id="datepicker2" type="text" class="form-control" disabled>
                      </div>
                      <div class="form-group">
                        <label for="oib">OIB</label>
                        <input type="text" class="form-control" id="edtoib" disabled>
                      </div>  
                      <div class="form-group">
                          <label for="adresa">Adresa</label>
                          <input type="text" class="form-control" id="edtadresa">
                      </div>  
                      <div class="form-group">
                          <label for="mjesto">Mjesto</label>
                          <input type="text" class="form-control" id="edtmjesto">
                      </div>  
                      <div class="form-group">
                          <label for="gmail">Email</label>
                          <input type="email" class="form-control" id="edtgmail">
                      </div>  
                    </form>
                  </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-dismiss="modal">Zatvori</button>
                  <button type="button" class="btn btn-dark" data-dismiss="modal" id="updateUser">Ažuriraj</button>
                </div>
              </div>
            </div>
          </div>
    </div>
