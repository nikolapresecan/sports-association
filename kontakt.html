    <div class="container justify-content-center align-items-center">
        <div class="row align-items-center justify-content-center">
            <div class="col-6">
                <div class="accordion" id="accordionExample">
                    <div class="card" style="background-color: slategray;">
                      <div class="card-header" id="headingOne">
                        <h5 class="mb-0">
                          <button class="btn btn" type="button" data-toggle="collapse" data-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                            <h4 class="font-weight-bold">Adresa</h4>
                          </button>
                        </h5>
                      </div>
                      <div id="collapseOne" class="collapse show" aria-labelledby="headingOne" data-parent="#accordionExample">
                        <div class="card-body">
                            Primjer ulica 123
                            <br>
                            Grad, Država
                            <br>
                            Poštanski broj: 12345
                        </div>
                      </div>
                    </div>
                    <div class="card" style="background-color: slategray;">
                      <div class="card-header" id="headingTwo">
                        <h5 class="mb-0">
                          <button class="btn btn collapsed" type="button" data-toggle="collapse" data-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                            <h4 class="font-weight-bold">Kontakt broj</h4>
                          </button>
                        </h5>
                      </div>
                      <div id="collapseTwo" class="collapse" aria-labelledby="headingTwo" data-parent="#accordionExample">
                        <div class="card-body">
                            +123 456 789
                        </div>
                      </div>
                    </div>
                    <div class="card" style="background-color: slategray;">
                      <div class="card-header" id="headingThree">
                        <h5 class="mb-0">
                          <button class="btn btn collapsed" type="button" data-toggle="collapse" data-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                            <h4 class="font-weight-bold">Radno vrijeme</h4>
                          </button>
                        </h5>
                      </div>
                      <div id="collapseThree" class="collapse" aria-labelledby="headingThree" data-parent="#accordionExample">
                        <div class="card-body">
                            Ponedjeljak - Petak: 9:00 - 18:00
                            <br>
                            Subota - Nedjelja: Zatvoreno
                        </div>
                      </div>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <h1 class="text-center">Kontaktirajte nas</h1>
                <form>
                    <div class="form-group">
                      <label for="ime">Ime</label>
                      <input type="text" class="form-control" id="ime" placeholder="Unesite ime">
                    </div>
                    <div class="form-group">
                      <label for="email1">Email</label>
                      <input type="email" class="form-control" id="email1" aria-describedby="emailHelp" placeholder="Unesite email">
                    </div>
                    <div class="form-group">
                      <label for="poruka">Poruka</label>
                      <textarea class="form-control" id="poruka" rows="3" placeholder="Unesite poruku"></textarea>
                    </div>
                    <button type="button" class="btnPosalji btn-dark" id="btnSend">Pošalji</button>
                  </form>
            </div>
        </div>
    </div>
